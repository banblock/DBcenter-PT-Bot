detect_main_node:
  ros__parameters:
    service_call_timeout_sec: 5.0

detect_cctv_node:
  ros__parameters:
    camera_devices: []  # 비워두면 연결된 웹캠을 자동 탐지
    camera_ids: ["cctv1", "cctv2"]
    min_camera_index: 2
    model_path: "models/cctv_best.pt"
    confidence: 0.13  #recall 우선 : 0.13, precision 우선 : 0.77
    jpeg_quality: 80
    device: ""  # 비워두면 ultralytics 기본 디바이스 선택
    image_width: 1280
    image_height: 960
    camera_fps: 30.0
    inference_size: 640

detect_ambient_node:
  ros__parameters:
    # 2모델 WBF 앙상블 구성 (yolov8n_amr_v2+TTA, yolo26n_amr_v2) - 3모델(yolo11n_amr_v3
    # 포함) 대비 이 조합이 mAP50/recall/F1 전부 더 높아서 11n_amr_v3 제외.
    model_paths:
      - "ambient_yolov8n_v2.pt"
      - "ambient_yolo26n_v2.pt"
    model_tta: [true, false]  # yolo26 계열은 augment=True 미지원(자동 revert)
    conf_threshold: 0.13  # F1 최적점(conf/wbf_merge_iou 2D 스윕 결과)
    wbf_merge_iou: 0.25  # F1 최적 구간(0.20~0.35) 중앙값
    amr_cam_topics:
      - "/robot3/oakd/rgb/preview/image_raw"
      - "/robot8/oakd/rgb/preview/image_raw"
    anomaly_classes:
      - "fire"
      - "smoke"
      - "coolant"
    normal_process_every_n: 1
    throttled_process_every_n: 10
    jpeg_quality: 80

detect_station_node:
  ros__parameters:
    amr_cam_topics:
      - "/robot3/oakd/rgb/preview/image_raw"
      - "/robot8/oakd/rgb/preview/image_raw"
    fresh_frame_timeout_sec: 2.0
    sample_frame_count: 3
    hough_dp: 1.2
    hough_min_dist: 50.0
    hough_param1: 100.0
    hough_param2: 30.0
    hough_min_radius: 10
    hough_max_radius: 100
    # red wraps around hue 0/180 in OpenCV HSV, so "closed" needs two ranges
    closed_hsv_lower1: [0, 70, 50]
    closed_hsv_upper1: [10, 255, 255]
    closed_hsv_lower2: [170, 70, 50]
    closed_hsv_upper2: [180, 255, 255]
    open_hsv_lower: [40, 70, 50]
    open_hsv_upper: [80, 255, 255]
    min_color_ratio: 0.3
